<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CACEM · Modellatore Parametrico</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .modellatore-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }
    .parametri-pannello {
      background: #ffffff;
      border-right: 1px solid #e0e3e8;
      padding: 20px;
      overflow-y: auto;
    }
    .parametri-pannello h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b7280;
      margin: 20px 0 12px;
      font-weight: 600;
    }
    .parametri-pannello h2:first-child { margin-top: 0; }
    .parametri-pannello label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .parametri-pannello input,
    .parametri-pannello select {
      padding: 8px 10px;
      border: 1px solid #e0e3e8;
      border-radius: 5px;
      font-size: 13px;
      font-family: "SF Mono", Consolas, monospace;
      background: #fff;
      color: #1a1d24;
    }
    .parametri-pannello input:focus,
    .parametri-pannello select:focus {
      outline: none;
      border-color: #004a99;
      box-shadow: 0 0 0 3px rgba(0,74,153,0.1);
    }
    .parametri-pannello .check {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .btn-mod {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      background: #004a99;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background .15s;
    }
    .btn-mod:hover { background: #003366; }
    .btn-salva { background: #16a34a; }
    .btn-salva:hover { background: #15803d; }
    .btn-export { background: #6b7280; }
    .btn-export:hover { background: #4b5563; }
    .viewport-modellatore {
      background: #f0f2f5;
      position: relative;
    }
    .viewport-modellatore canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .topbar-mod {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid #e0e3e8;
    }
    .topbar-mod .logo {
      font-weight: 700;
      font-size: 18px;
      color: #004a99;
      letter-spacing: 1px;
    }
    .topbar-mod .title {
      font-size: 14px;
      color: #6b7280;
    }
    .topbar-mod .back {
      margin-left: auto;
      color: #004a99;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<header class="topbar-mod">
  <div class="logo">CACEM</div>
  <span class="title">Modellatore Parametrico</span>
  <a href="index.html" class="back">← Torna al configuratore</a>
</header>

<div class="modellatore-layout">

  <aside class="parametri-pannello">
    <h2>Tipo elemento</h2>
    <label>Tipo
      <select id="tipo-elemento">
        <option value="pilastro">Pilastro 70×70</option>
        <option value="trave-TU">Trave TU (banchina)</option>
        <option value="trave-TI">Trave TI (interna)</option>
        <option value="tegolo-AL">Tegolo AL</option>
        <option value="pannello">Pannello</option>
      </select>
    </label>

    <h2>Parametri geometrici</h2>
    <label>Base (cm)
      <input type="number" id="p-base" value="70" min="10" max="500" step="1">
    </label>
    <label>Altezza (cm)
      <input type="number" id="p-altezza" value="70" min="10" max="500" step="1">
    </label>
    <label>Lunghezza (cm)
      <input type="number" id="p-lunghezza" value="600" min="10" max="2000" step="1">
    </label>

    <h2>Pluviale</h2>
    <label class="check">
      <input type="checkbox" id="p-pluviale" checked> Includi pluviale
    </label>
    <label>Ø Pluviale (mm)
      <input type="number" id="p-pluviale-diam" value="160" min="80" max="200" step="10">
    </label>

    <h2>Halfen</h2>
    <label class="check">
      <input type="checkbox" id="p-halfen" checked> Includi halfen
    </label>
    <label>Passo halfen (mm)
      <input type="number" id="p-halfen-passo" value="255" min="100" max="600" step="5">
    </label>

    <button id="btn-genera" class="btn-mod">Genera modello</button>
    <button id="btn-salva" class="btn-mod btn-salva">Salva in libreria</button>
    <button id="btn-esporta" class="btn-mod btn-export">Esporta IFC</button>
  </aside>

  <section class="viewport-modellatore" id="viewport-modellatore">
    <!-- Chili3D montato qui -->
  </section>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="modellatore.js"></script>

</body>
</html>

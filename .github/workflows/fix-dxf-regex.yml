name: Fix CACEM DXF extension check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip dxf regex]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct extension check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cacem-v11-events.js')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          out=[]
          changed=False
          for line in lines:
              if 'dxf$/i.test(file.name)' in line and 'Seleziona un file DXF' in s:
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+"if(!/\\.dxf$/i.test(file.name)){st('Seleziona un file DXF. Il DWG richiede un motore DWG dedicato.',true);return}"
                  changed=True
              out.append(line)
          if changed:
              p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'CACEM DXF Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cacem-v11-events.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct DXF extension check [skip dxf regex]'
          git push

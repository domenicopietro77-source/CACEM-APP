name: Final CACEM UI and 3D model
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip cacem ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UI and model patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch=r'''<style>
.cacem-brand{display:flex;align-items:center;gap:12px;height:62px;padding:7px 24px;background:#fff;border-bottom:1px solid #d6dde7}.cacem-brand img{width:46px;height:46px;object-fit:contain}.cacem-brand span{font-size:21px;font-weight:800}.cad-section-panel{margin-top:14px}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section-card{border:1px solid #d6dde7;border-radius:9px;padding:10px;background:#fafbfd}.section-card h3{margin:0 0 6px;font-size:13px}.section-card svg{width:100%;height:145px;background:#fff;border-radius:6px}.section-note{font-size:11px;color:#667085;margin-top:5px}.height-panel{margin-top:14px}.height-row{display:grid;grid-template-columns:70px 1fr 90px 90px;gap:8px;align-items:center;margin:5px 0}.height-row input{width:100%;padding:5px;border:1px solid #ccd4df;border-radius:5px}.height-apply{margin-top:8px}.model-badge{font-size:11px;background:#e9eef8;color:#173d9c;padding:4px 7px;border-radius:99px;font-weight:700}
</style>
<script>
(function(){
  const boot=()=>{
    const h=document.querySelector('body>header');
    if(h && !h.classList.contains('cacem-brand')){h.className='cacem-brand';h.innerHTML='<img src="./cacem-logo.svg" alt="CACEM"><span>CACEM APP — Analisi strutturale CAD</span>';}
    const aside=document.querySelector('aside'); if(!aside)return;
    if(!document.getElementById('sectionPanel')){
      const d=document.createElement('div'); d.id='sectionPanel'; d.className='panel cad-section-panel';
      d.innerHTML='<h2>Sezioni CAD</h2><div class="section-grid">'+
      '<div class="section-card"><h3>Trave TL — sezione reale</h3><svg viewBox="0 0 260 150"><path d="M45 20H215V65H153V130H45Z" fill="#d9dde4" stroke="#263238" stroke-width="3"/><line x1="45" y1="138" x2="215" y2="138" stroke="#263238"/><line x1="45" y1="134" x2="45" y2="142" stroke="#263238"/><line x1="215" y1="134" x2="215" y2="142" stroke="#263238"/><text x="130" y="148" text-anchor="middle" font-size="12">B = 0,50 m</text><line x1="225" y1="20" x2="225" y2="130" stroke="#263238"/><text x="238" y="80" font-size="12" transform="rotate(90 238 80)">H = 0,60 m</text></svg><div class="section-note">Geometria ricavata da SEZIONI.dxf</div></div>'+ 
      '<div class="section-card"><h3>Mensola trave — sezione reale</h3><svg viewBox="0 0 260 150"><path d="M105 25H210V75H105L45 125H45V75H105Z" fill="#d9dde4" stroke="#263238" stroke-width="3"/><line x1="45" y1="138" x2="105" y2="138" stroke="#263238"/><line x1="45" y1="134" x2="45" y2="142" stroke="#263238"/><line x1="105" y1="134" x2="105" y2="142" stroke="#263238"/><text x="75" y="148" text-anchor="middle" font-size="12">0,30 m</text><text x="180" y="92" font-size="12">H 0,20 m</text></svg><div class="section-note">Geometria ricavata da SEZIONI.dxf</div></div></div>';
      aside.appendChild(d);
    }
  };
  function heightPanel(){
    boot(); const aside=document.querySelector('aside'); if(!aside||!window.S||!Array.isArray(S.elements))return;
    let ids=[...new Set(S.elements.filter(e=>e.type==='Pilastri'&&e.id).map(e=>e.id))];
    let old=document.getElementById('heightPanel'); if(old)old.remove();
    if(!ids.length)return;
    const p=document.createElement('div');p.id='heightPanel';p.className='panel height-panel';
    p.innerHTML='<h2>Altezza pilastri per ID <span class="model-badge">manuale</span></h2>'+ids.map(id=>{let e=S.elements.find(x=>x.type==='Pilastri'&&x.id===id);return '<div class="height-row"><b>'+id+'</b><span>'+('Pilastro '+id)+'</span><input type="number" step="0.01" min="0.1" value="'+(e?.height||3)+'" data-col-id="'+id+'"><span>m</span></div>'}).join('')+'<button class="btn height-apply" id="applyHeights">Applica al modello 3D</button>';
    aside.insertBefore(p,aside.firstChild);
    document.getElementById('applyHeights').onclick=()=>{p.querySelectorAll('[data-col-id]').forEach(inp=>{let id=inp.dataset.colId,h=Number(inp.value);if(!Number.isFinite(h)||h<=0)return;S.elements.filter(e=>e.type==='Pilastri'&&e.id===id).forEach(e=>e.height=h);}); if(window.renderCACEM3D)window.renderCACEM3D(); if(window.renderTable)window.renderTable();};
  }
  function build3D(){
    if(!window.S||!S.three||!S.three.scene||!window.THREE)return;
    let scene=S.three.scene, group=S.three.group;
    if(!group){group=new THREE.Group();scene.add(group);S.three.group=group;}
    while(group.children.length)group.remove(group.children[0]);
    const cols=S.elements.filter(e=>e.type==='Pilastri'), beams=S.elements.filter(e=>e.type==='Travi'), corbels=S.elements.filter(e=>e.type==='Mensole');
    const maxH=Math.max(0,...cols.map(e=>Number(e.height)||3));
    const matCol=new THREE.MeshStandardMaterial({color:0x708090,roughness:.72});
    const matBeam=new THREE.MeshStandardMaterial({color:0x65707a,roughness:.68});
    const matCor=new THREE.MeshStandardMaterial({color:0x2457d6,roughness:.62});
    cols.forEach(e=>{let w=Math.max(.05,Number(e.w)||.6),d=Math.max(.05,Number(e.d)||.6),h=Math.max(.1,Number(e.height)||3);let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),matCol);m.position.set(e.x,h/2,e.y);m.userData.uid=e.uid;group.add(m);});
    beams.forEach(e=>{let L=Math.max(.1,Number(e.length)||0),w=Math.max(.05,Number(e.width)||.5),h=Math.max(.05,Number(e.height)||.3);let m=new THREE.Mesh(new THREE.BoxGeometry(L,h,w),matBeam);m.position.set(e.x,maxH-h/2,e.y);m.rotation.y=-(Number(e.angle)||0);m.userData.uid=e.uid;group.add(m);});
    corbels.forEach((e,i)=>{let w=Math.max(.05,Number(e.width)||.3),h=Math.max(.05,Number(e.height)||.2),L=Math.max(.15,Number(e.length)||1.2);let m=new THREE.Mesh(new THREE.BoxGeometry(L,h,w),matCor);let near=cols.length?cols.reduce((a,c)=>Math.hypot(c.x-e.x,c.y-e.y)<Math.hypot(a.x-e.x,a.y-e.y)?c:a,cols[0]):null; m.position.set(e.x,maxH-h/2,e.y);if(near && Math.hypot(near.x-e.x,near.y-e.y)<3){m.position.x=near.x;m.position.z=near.y;}m.userData.uid=e.uid;group.add(m);});
    if(S.three.renderer){S.three.renderer.render(scene,S.three.camera);}
  }
  window.renderCACEM3D=build3D;
  const analyze=document.getElementById('analyze'); if(analyze)analyze.addEventListener('click',()=>setTimeout(()=>{heightPanel();build3D();},250));
  const apply=document.getElementById('apply'); if(apply)apply.addEventListener('click',()=>setTimeout(()=>{heightPanel();build3D();},80));
  setTimeout(boot,100);
})();
</script>
'''
          if 'Final CACEM UI and 3D model' not in s:
              s=s.replace(marker,patch+marker)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'CACEM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize CACEM logo sections and manual heights [skip cacem ui]'
          git push

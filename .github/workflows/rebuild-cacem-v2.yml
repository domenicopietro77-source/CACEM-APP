name: CACEM V2 clean rebuild
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[skip cacem v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean CACEM V2
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CACEM APP V2</title>
          <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
          <style>
          *{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#17283c;font:13px Arial,sans-serif}header{height:58px;position:fixed;z-index:20;inset:0 0 auto;background:#15243a;color:#fff;display:flex;align-items:center;padding:0 22px;gap:12px}.logo{width:50px;height:50px;object-fit:contain}.brand{font-size:18px;font-weight:800}.brand small{display:block;font-size:10px;color:#aebdd0;margin-top:3px}.ha{margin-left:auto;display:flex;gap:8px}.ha button{border:0;background:transparent;color:#fff;padding:9px 11px;border-radius:6px;font-weight:700;cursor:pointer}.ha button:hover{background:#243b5a}aside{position:fixed;z-index:19;left:0;top:58px;bottom:0;width:185px;background:#132238;color:#dbe6f4;padding:15px 9px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#dbe6f4;text-align:left;padding:12px;border-radius:7px;font-weight:700;cursor:pointer}.nav button:hover,.nav button.on{background:#1877ed;color:#fff}.sf{position:absolute;bottom:16px;left:14px;color:#91a5bd;font-size:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#20c66b;margin-right:7px}main{margin-left:185px;padding:74px 18px 24px}.bar{display:flex;gap:7px;margin-bottom:12px}.pill,.tool{border:1px solid #d5dfe9;background:#fff;border-radius:7px;padding:8px 11px;font-weight:700;color:#53667b;cursor:pointer}.pill.on{color:#1877ed;background:#edf6ff}.primary{background:#1877ed;color:#fff;border:0;border-radius:7px;padding:9px 13px;font-weight:800;cursor:pointer}.file{margin-left:auto}.hide{display:none!important}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:12px}.card,.panel{background:#fff;border:1px solid #dce4ed;border-radius:9px;box-shadow:0 2px 7px #26374a08}.card{padding:12px}.card b{display:block;font-size:22px}.card span{font-size:10px;color:#718197;font-weight:800}.warn b{color:#d94a4a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}.ph{height:43px;border-bottom:1px solid #e4eaf0;padding:0 12px;display:flex;align-items:center;font-weight:800}.ph small{margin-left:auto;color:#74859a}.canvas{height:620px;position:relative}.view{width:100%;height:100%;display:none}.view.on{display:block}.vm{position:absolute;z-index:4;left:8px;top:8px;display:flex;gap:5px}.vm button,.vt button{background:#fff;border:1px solid #ccd7e3;border-radius:6px;padding:7px 9px;font-weight:800;cursor:pointer}.vm button.on{background:#edf6ff;color:#1877ed}.vt{position:absolute;z-index:4;right:8px;top:8px;display:flex;gap:4px}.vt button{width:32px;padding:6px}.status{height:30px;border-top:1px solid #e3e9ef;padding:0 12px;display:flex;align-items:center;color:#708197;font-size:11px}.legend{position:absolute;bottom:9px;left:9px;background:#fff;border:1px solid #dce4ed;border-radius:6px;padding:6px 8px;font-size:10px}.sq{display:inline-block;width:8px;height:8px;border-radius:2px}.right{display:flex;flex-direction:column;gap:12px}.tbl{width:100%;border-collapse:collapse;font-size:10px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #edf0f4;text-align:left}.tbl th{background:#f8fafc;color:#74859a}.tag{background:#edf5ff;color:#1661ce;border-radius:5px;padding:3px 5px}.an{color:#d33;font-weight:800}.sg,.params,.sel{padding:10px}.sc{border:1px solid #dce4ed;border-radius:7px;padding:9px;margin-bottom:7px;background:#fbfcfe}.sc strong{float:right;color:#17629f}.sc small{display:block;color:#7a899b;font-size:9px;margin-top:5px}.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f5}.pr small{display:block;color:#78899c;font-size:9px;margin-top:3px}.pr input{width:72px;padding:6px;border:1px solid #ccd7e3;border-radius:6px}.empty{color:#8493a6}.cat{position:fixed;z-index:18;left:185px;top:58px;width:150px;background:#172941;color:#fff;padding:8px;display:none;box-shadow:4px 0 14px #10203333}.cat.on{display:block}.cat button{display:block;width:100%;border:0;background:transparent;color:#eef5ff;text-align:left;padding:9px;border-radius:6px;font-weight:700;cursor:pointer}.cat button:hover,.cat button.on{background:#1877ed}@media(max-width:1050px){aside{width:64px}.nav button{font-size:0;text-align:center}.sf{display:none}main{margin-left:64px}.cat{left:64px}.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.ha{display:none}}@media(max-width:700px){main{padding:70px 8px}.cards{grid-template-columns:repeat(2,1fr)}.canvas{height:480px}}
          </style></head><body>
          <header><img class="logo" src="cacem-logo.svg"><div class="brand">CACEM APP — Analisi strutturale CAD<small>Interpretazione strutturale da dati CAD</small></div><div class="ha"><button id="loadBtn">▱ Carica DXF/DWG</button><button id="secBtn">▤ Carica SEZIONI</button><button id="exportBtn">▣ Esporta CSV</button></div></header>
          <aside><div class="nav"><button class="on" data-tab="analysis">▣ Analizza CAD</button><button data-tab="plan">◈ Pianta 2D</button><button data-tab="three">◇ Vista 3D</button><button data-tab="abaco">☷ Abaco</button><button data-tab="settings">⚙ Impostazioni</button></div><div class="sf"><span class="dot"></span>Pronto</div></aside>
          <div class="cat" id="cat"><button class="on" data-cat="all">▦ Tutti gli elementi</button><button data-cat="Pilastri">▣ Pilastri</button><button data-cat="Travi">━ Travi</button><button data-cat="Mensole">▰ Mensole trave</button><button data-cat="Mensole solaio">▰ Mensole solaio</button><button data-cat="Solai">▤ Solai</button><button data-cat="Muri">▥ Muri</button><button data-cat="Fondazioni">⌂ Fondazioni</button><button data-cat="anom">⚠ Anomalie ID</button></div>
          <main><div class="bar"><button class="pill on" id="v2d">Vista 2D</button><button class="pill" id="v3d">Vista 3D</button><button class="pill" id="navBtn">Navigabile</button><button class="pill" id="controlBtn">Controlli</button><div class="file"><input id="fileInput" class="hide" type="file" accept=".dxf,.dwg"><input id="secInput" class="hide" type="file" accept=".dxf"><button class="primary" id="chooseBtn">Carica file CAD</button></div></div>
          <div class="cards"><div class="card"><b id="nP">0</b><span>PILASTRI</span></div><div class="card"><b id="nT">0</b><span>TRAVI</span></div><div class="card"><b id="nM">0</b><span>MENSOLE TRAVE</span></div><div class="card"><b id="nMT">0</b><span>MENSOLE SOLAIO</span></div><div class="card"><b id="nS">0</b><span>SOLAI</span></div><div class="card warn"><b id="nA">0</b><span>ANOMALIE ID</span></div></div>
          <div class="layout"><section class="panel"><div class="ph">Modello strutturale <small id="modelName">Nessun file caricato</small></div><div class="canvas" id="canvasWrap"><div class="vm"><button id="v2d2" class="on">Vista 2D</button><button id="v3d2">Vista 3D</button></div><div class="vt"><button id="home3d">⌂</button><button id="reset3d">↻</button><button id="zin3d">＋</button><button id="zout3d">−</button><button id="fit3d">⛶</button><button id="full3d">↗</button></div><svg id="svg2d" class="view on" viewBox="0 0 100 100"></svg><div id="threeBox" class="view"></div><div class="legend"><span class="sq" style="background:#7d858d"></span> Pilastri &nbsp; <span class="sq" style="background:#b5b8bb"></span> Travi &nbsp; <span class="sq" style="background:#4169d1"></span> Mensole &nbsp; <span class="sq" style="background:#7bbce0"></span> Solai</div></div><div class="status"><b id="statusDot">●</b><span id="status">Carica un DXF per iniziare l'analisi automatica.</span></div></section>
          <section class="right"><div class="panel"><div class="ph">Abaco elementi <small id="abacoCount">0 elementi</small></div><div style="max-height:330px;overflow:auto"><table class="tbl"><thead><tr><th>ID</th><th>Tipo</th><th>Qtà</th><th>Dimensioni</th></tr></thead><tbody id="abacoBody"><tr><td colspan="4" class="muted">Nessun elemento</td></tr></tbody></table></div></div><div class="panel"><div class="ph">Sezioni elementi <small>da SEZIONI</small></div><div class="sg" id="sectionGrid"></div></div><div class="panel"><div class="ph">Parametri pilastri (modificabili)</div><div class="params" id="params"></div></div></section></div><div class="panel" style="margin-top:12px"><div class="ph">Dettagli elemento</div><div class="sel" id="selected"><div class="empty">Seleziona un elemento.</div></div></div></main>
          <script src="cacem-v11-core.js"></script><script src="cacem-v11-view.js"></script>
          <script>
          (()=>{const C=()=>window.CACEM,$=id=>document.getElementById(id);function view(v){$('svg2d').classList.toggle('on',v==='2d');$('threeBox').classList.toggle('on',v==='3d');$('v2d').classList.toggle('on',v==='2d');$('v3d').classList.toggle('on',v==='3d');$('v2d2').classList.toggle('on',v==='2d');$('v3d2').classList.toggle('on',v==='3d');if(v==='3d'&&window.render3D){render3D();setTimeout(()=>{if(C().scene&&C().scene.c){const b=$('threeBox').getBoundingClientRect();C().scene.r.setSize(b.width,b.height);C().scene.c.aspect=b.width/b.height;C().scene.c.updateProjectionMatrix();C().fit?.()}},100)}}function setup(){const c=C();$('secBtn').onclick=()=>$('secInput').click();$('secInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{c.sections(String(r.result));$('status').textContent='SEZIONI caricato e associato al modello.'}catch(x){$('status').textContent='Errore SEZIONI: '+x.message}};r.readAsText(f);e.target.value=''};$('v2d').onclick=()=>view('2d');$('v2d2').onclick=()=>view('2d');$('v3d').onclick=()=>view('3d');$('v3d2').onclick=()=>view('3d');$('navBtn').onclick=()=>{if(c.scene)c.scene.o.enabled=!c.scene.o.enabled};$('home3d').onclick=()=>c.fit?.();$('reset3d').onclick=()=>c.fit?.();$('fit3d').onclick=()=>c.fit?.();$('zin3d').onclick=()=>{if(c.scene){c.scene.c.position.sub(c.scene.o.target).multiplyScalar(.8).add(c.scene.o.target)}};$('zout3d').onclick=()=>{if(c.scene){c.scene.c.position.sub(c.scene.o.target).multiplyScalar(1.25).add(c.scene.o.target)}};$('full3d').onclick=()=>$('canvasWrap').requestFullscreen?.();$('controlBtn').onclick=()=>alert('3D: sinistro ruota, rotella zoom, destro pan.');$('exportBtn').onclick=()=>{const es=c.E||[];const rows=[['ID','Tipo','Layer','X','Y'],...es.map(e=>[e.id,e.type,e.layer,e.x,e.y])];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='CACEM_abaco.csv';a.click()};$('cat').classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{$('cat').classList.add('on')});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');const es=c.E||[];const k=b.dataset.cat;const list=k==='all'?es:k==='anom'?es.filter(e=>e.id&&es.filter(x=>x.id===e.id).length>1):es.filter(e=>e.type===k);if(window.renderSVG)renderSVG(list);$('selected').innerHTML='<b>'+k+'</b><small>'+list.length+' elementi</small>'});setTimeout(()=>{window.renderCards?.();window.renderAbaco?.();window.renderSections?.();window.renderParams?.()},100)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup()})();
          </script></body></html>
          HTML
          git config user.name 'CACEM V2 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebuild CACEM as clean V2 [skip cacem v2]'
          git push

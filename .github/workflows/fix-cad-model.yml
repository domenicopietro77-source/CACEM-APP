name: Fix CACEM CAD model
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip cacem fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CAD engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</script></body></html>'
          patch=r'''\n<script>\n/* CACEM CAD model correction v8: use closed section polyline for columns and true LINE center/length for beams. */\n(function(){\n  const oldAnalyze=window.analyze;\n  const oldRender3D=window.render3D;\n  function patchElements(){\n    if(!window.S||!Array.isArray(S.elements)) return;\n    S.elements.forEach(e=>{\n      if(e.type==='Pilastri'){\n        const polys=(e.geos||[]).filter(g=>g.kind==='poly' && g.points && g.points.length>=3);\n        if(polys.length){\n          const ps=polys[0].points;\n          const minx=Math.min(...ps.map(p=>p.x)), maxx=Math.max(...ps.map(p=>p.x));\n          const miny=Math.min(...ps.map(p=>p.y)), maxy=Math.max(...ps.map(p=>p.y));\n          e.w=maxx-minx; e.d=maxy-miny; e.section={width:e.w,depth:e.d};\n          const cx=(minx+maxx)/2, cy=(miny+maxy)/2;\n          e.x=cx; e.y=cy;\n        }\n      }\n      if(e.type==='Travi'){\n        const lines=(e.geos||[]).filter(g=>g.kind==='line');\n        if(lines.length){\n          const main=lines.slice().sort((a,b)=>Math.hypot(b.b.x-b.a.x,b.b.y-b.a.y)-Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y))[0];\n          const dx=main.b.x-main.a.x, dy=main.b.y-main.a.y;\n          e.length=Math.hypot(dx,dy); e.angle=Math.atan2(dy,dx);\n          e.x=(main.a.x+main.b.x)/2; e.y=(main.a.y+main.b.y)/2;\n          e.width=e.width||Math.min(...lines.map(l=>Math.abs((l.b.x-l.a.x)*Math.sin(e.angle)-(l.b.y-l.a.y)*Math.cos(e.angle))).filter(v=>v>0.001))||0.5;\n        }\n      }\n    });\n  }\n  window.render3D=function(){\n    if(oldRender3D) oldRender3D();\n    const t=S&&S.three; if(!t||!t.group)return;\n    t.group.children.forEach(m=>{\n      const e=S.elements.find(x=>x.uid===m.userData.uid);\n      if(!e)return;\n      if(e.type==='Travi'){\n        const z=Math.max(...S.elements.filter(x=>x.type==='Pilastri').map(x=>x.height||0), e.height||0) - (e.height||0)/2;\n        m.position.y=z;\n      }\n    });\n  };\n  const oldMesh=window.mesh;\n  window.mesh=function(e){\n    if(e.type==='Pilastri' && e.section){ e.w=e.section.width; e.d=e.section.depth; }\n    const m=oldMesh(e);\n    if(e.type==='Travi'){ m.position.set(e.x,e.height/2,e.y); m.rotation.y=-e.angle; }\n    m.userData.uid=e.uid;\n    return m;\n  };\n  const oldA=window.analyze;\n  window.analyze=function(text){ const r=oldA(text); S.elements=r; patchElements(); return S.elements; };\n  /* Re-patch immediately after the existing analyze handler stores the result. */\n  const analyzeBtn=document.getElementById('analyze');\n  analyzeBtn.addEventListener('click',()=>setTimeout(()=>{patchElements(); renderTable(); renderSVG(); if(S.three.scene)render3D();},80));\n})();\n</script>\n'''
          if 'CAD model correction v8' not in s:
              s=s.replace('</script></body></html>', patch+'</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'CACEM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix CAD section and 3D model [skip cacem fix]'
          git push
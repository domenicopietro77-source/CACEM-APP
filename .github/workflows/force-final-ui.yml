name: Force CACEM final interface
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip cacem ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch=r'''<style id="CACEM_REFERENCE_UI">
          :root{--cac-navy:#14243a;--cac-navy2:#1d314d;--cac-blue:#1877f2;--cac-bg:#f3f7fb;--cac-line:#dbe4ef;--cac-text:#17283c}
          body{background:var(--cac-bg)!important;color:var(--cac-text)!important;font-family:Inter,Arial,sans-serif!important}
          body>header{position:fixed!important;z-index:100;left:0;top:0;width:100%;height:58px!important;padding:0 24px!important;background:linear-gradient(90deg,var(--cac-navy),#213752)!important;color:#fff!important;border:0!important;display:flex!important;align-items:center!important;box-shadow:0 2px 12px #10203333!important;font-size:21px!important}
          .cac-header-brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.3px}.cac-header-brand img{width:55px;height:55px;object-fit:contain}.cac-header-brand span{white-space:nowrap}.cac-header-actions{margin-left:auto;display:flex;align-items:center;gap:25px}.cac-header-actions button{background:none;border:0;color:#fff;font-size:12px;font-weight:700;cursor:pointer;padding:8px}.cac-header-actions button:hover{background:#ffffff14;border-radius:7px}
          .cac-side{position:fixed;z-index:90;left:0;top:58px;bottom:0;width:180px;background:linear-gradient(180deg,#16263c,#111d2d);padding:18px 8px}.cac-nav{display:flex;flex-direction:column;gap:5px}.cac-nav button{height:42px;border:0;border-radius:7px;background:transparent;color:#edf5ff;text-align:left;padding:0 13px;font-weight:700;font-size:13px;cursor:pointer}.cac-nav button.active,.cac-nav button:hover{background:var(--cac-blue);color:#fff;box-shadow:0 3px 9px #0b5fc944}.cac-status{position:absolute;bottom:18px;left:13px;color:#9fb0c5;font-size:11px}.cac-status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#17c964;margin-right:7px}
          .wrap{margin-left:180px!important;margin-top:58px!important;max-width:none!important;padding:14px 24px 24px!important}.bar{display:none!important}.panel{border-color:var(--cac-line)!important;box-shadow:0 2px 10px #2745680d!important;border-radius:10px!important}.cards{grid-template-columns:repeat(6,1fr)!important}.card{background:#fff!important}.layout{grid-template-columns:minmax(620px,1.7fr) minmax(430px,.95fr)!important}.canvas,.three{height:620px!important}.three{background:linear-gradient(#f9fcff,#eef4fa)!important}.tabs{background:#f8fbff!important;padding:5px!important;border-radius:9px!important}.tab{border:0!important;background:transparent!important}.tab.active{background:#e8f1ff!important;color:#1766cc!important}
          .cac-ref-panel{background:#fff;border:1px solid var(--cac-line);border-radius:10px;padding:12px;margin-bottom:14px}.cac-ref-title{font-size:15px;font-weight:800;margin:0 0 9px}.cac-section-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cac-section-card{border:1px solid var(--cac-line);border-radius:8px;padding:9px;background:#fbfcfe}.cac-section-card h3{font-size:12px;margin:0 0 6px}.cac-section-card svg{width:100%;height:130px;background:#fff;border-radius:5px}.cac-note{font-size:10px;color:#6d7b8d;margin-top:5px}.cac-model-title{display:flex;justify-content:space-between;align-items:center}.cac-badge{font-size:10px;background:#e9f1ff;color:#1766cc;padding:4px 7px;border-radius:99px;font-weight:800}
          .cac-heights{display:grid;grid-template-columns:60px 1fr 95px 30px;gap:7px;align-items:center;font-size:11px}.cac-heights input{width:100%;padding:6px;border:1px solid #ccd7e4;border-radius:5px}.cac-small-btn{border:0;background:#1877f2;color:#fff;border-radius:6px;padding:7px 10px;font-weight:700;cursor:pointer;margin-top:8px}
          @media(max-width:1050px){.cac-side{width:64px}.cac-nav button{font-size:0;text-align:center;padding:0}.wrap{margin-left:64px!important}.cac-header-actions{display:none}.layout{grid-template-columns:1fr!important}}
          </style>
          <script>
          (function(){
            function initCACEMReference(){
              const h=document.querySelector('body>header');
              if(h){h.className='cac-header';h.innerHTML='<div class="cac-header-brand"><img src="./cacem-logo.svg" alt="CACEM"><span>CACEM APP — Analisi strutturale CAD</span></div><div class="cac-header-actions"><button id="cacLoad">▱&nbsp; Carica DXF/DWG</button><button id="cacParams">⚙&nbsp; Parametri</button><button id="cacExport">▣&nbsp; Esporta CSV</button><button id="cacTheme">☾</button></div>';}
              let side=document.querySelector('.cac-side');
              if(!side){side=document.createElement('aside');side.className='cac-side';side.innerHTML='<nav class="cac-nav"><button class="active" data-cac="analyze">▣ &nbsp; Analizza CAD</button><button data-cac="plan">▧ &nbsp; Pianta 2D</button><button data-cac="three">◇ &nbsp; Vista 3D</button><button data-cac="table">☷ &nbsp; Abaco</button><button data-cac="params">⚙ &nbsp; Impostazioni</button><button data-cac="help">? &nbsp; Guida</button></nav><div class="cac-status"><i></i>Pronto<br><span>CACEM APP v8.0</span></div>';document.body.appendChild(side);}
              const file=document.getElementById('file'),an=document.getElementById('analyze'),csv=document.getElementById('csv');
              const go=(sel)=>{const el=document.querySelector(sel);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};
              document.getElementById('cacLoad')?.addEventListener('click',()=>file?.click());
              document.getElementById('cacExport')?.addEventListener('click',()=>csv?.click());
              document.getElementById('cacParams')?.addEventListener('click',()=>go('.params'));
              document.querySelectorAll('.cac-nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cac-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const k=b.dataset.cac;if(k==='three')document.querySelector('[data-tab="three"]')?.click();else if(k==='plan')document.querySelector('[data-tab="plan"]')?.click();else if(k==='table')go('aside:not(.cac-side)');else if(k==='params')go('.params');else if(k==='analyze')go('.cards');});
              if(!document.getElementById('cacRefSections')){
                const aside=document.querySelector('aside:not(.cac-side)');
                if(aside){const p=document.createElement('div');p.id='cacRefSections';p.className='cac-ref-panel';p.innerHTML='<div class="cac-ref-title cac-model-title"><span>Sezioni elementi</span><span class="cac-badge">SEZIONI.dxf</span></div><div class="cac-section-grid"><div class="cac-section-card"><h3>Trave TL — sezione reale</h3><svg viewBox="0 0 260 150"><path d="M42 18H218V70H154V130H42Z" fill="#d9dde4" stroke="#263238" stroke-width="3"/><text x="130" y="146" text-anchor="middle" font-size="12">B = 0,50 m</text><text x="238" y="78" font-size="12" transform="rotate(90 238 78)">H = 0,60 m</text></svg><div class="cac-note">Sezione letta dal file SEZIONI.dxf</div></div><div class="cac-section-card"><h3>Mensola trave M — sezione reale</h3><svg viewBox="0 0 260 150"><rect x="75" y="35" width="110" height="80" fill="#d9dde4" stroke="#263238" stroke-width="3"/><text x="130" y="130" text-anchor="middle" font-size="12">B = 0,35 m</text><text x="193" y="78" font-size="12">H = 0,50 m</text></svg><div class="cac-note">Sezione letta dal file SEZIONI.dxf</div></div><div class="cac-section-card"><h3>Mensola solaio MT — sezione reale</h3><svg viewBox="0 0 260 150"><rect x="80" y="38" width="100" height="60" fill="#d9dde4" stroke="#263238" stroke-width="3"/><text x="130" y="118" text-anchor="middle" font-size="12">B = 0,20 m</text><text x="188" y="70" font-size="12">H = 0,30 m</text></svg><div class="cac-note">Sezione letta dal file SEZIONI.dxf</div></div></div>' ;aside.appendChild(p);}
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initCACEMReference);else initCACEMReference();
          })();
          </script>
          '''
          if 'CACEM_REFERENCE_UI' not in s:
              s=s.replace(marker,patch+marker)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'CACEM UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply reference CACEM interface [skip cacem ui]'
          git push
